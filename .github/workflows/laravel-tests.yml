name: Laravel tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Code style, static analysis, and audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skuul
          persist-credentials: false

      - name: Check for unresolved merge markers
        working-directory: skuul
        run: |
          if git grep --line-number -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'Resolve all merge conflict markers before merging.'
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, redis, xml, zip
          coverage: none

      - name: Install PHP dependencies
        working-directory: skuul
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Validate Composer configuration and platform
        working-directory: skuul
        run: |
          composer validate --strict
          composer check-platform-reqs

      - name: Check code style (dry run)
        working-directory: skuul
        run: vendor/bin/pint --test

      - name: Run static analysis
        working-directory: skuul
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Audit dependencies
        working-directory: skuul
        run: composer audit

  tests:
    name: Unit and feature tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
        ports:
          - '3306:3306'
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out the application
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: skuul
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: ${{ matrix.php }}
          extensions: bcmath, curl, dom, gd, intl, mbstring, pdo_mysql, redis, xml, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false

      # phpunit.xml points the tests at Sail's database: host mysql, user sail.
      # The service creates a user with access only to the testing database.
      - name: Resolve the testing database host
        run: echo '127.0.0.1 mysql' | sudo tee -a /etc/hosts

      - name: Install PHP dependencies
        working-directory: skuul
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        working-directory: skuul
        run: |
          cp .env.testing .env
          php artisan key:generate --no-interaction

      - name: Build front-end assets
        working-directory: skuul
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Run tests
        working-directory: skuul
        run: php artisan test --compact

      - name: Verify production boot without development packages
        working-directory: skuul
        env:
          APP_ENV: production
          APP_DEBUG: 'false'
        run: |
          composer install --no-dev --no-ansi --no-interaction --no-progress --prefer-dist --optimize-autoloader
          composer check-platform-reqs --no-dev
          php artisan config:cache --no-interaction
          php artisan route:cache --no-interaction
          php artisan view:cache --no-interaction
          php artisan about --only=environment --no-interaction
