name: Laravel tests

on:
  push:
  pull_request:
    branches: [main, dev]

jobs:
  quality:
    name: Code style, static analysis, and audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          path: skuul

      - name: Check for unresolved merge markers
        working-directory: skuul
        run: |
          if git grep --line-number -E '^(<<<<<<<|=======|>>>>>>>)' -- .; then
            echo 'Resolve all merge conflict markers before merging.'
            exit 1
          fi

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, mbstring, pdo_mysql, zip
          coverage: none

      - name: Install PHP dependencies
        working-directory: skuul
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Check code style (dry run)
        working-directory: skuul
        run: vendor/bin/pint --test

      - name: Run static analysis
        working-directory: skuul
        run: vendor/bin/phpstan analyse --memory-limit=2G --no-progress

      - name: Audit dependencies
        working-directory: skuul
        run: composer audit

  tests:
    name: Unit and feature tests
    runs-on: ubuntu-latest
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: testing
      DB_USERNAME: sail
      DB_PASSWORD: password
    steps:
      - name: Check out the application
        uses: actions/checkout@v4
        with:
          path: skuul

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, gd, mbstring, pdo_mysql, zip
          coverage: none

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # phpunit.xml points the tests at Sail's database: host mysql, user sail.
      # The runner gives that name and that user to its own MySQL server.
      - name: Start MySQL
        run: |
          sudo /etc/init.d/mysql start
          echo "127.0.0.1 mysql" | sudo tee -a /etc/hosts
          mysql -h 127.0.0.1 -uroot -proot -e "CREATE DATABASE IF NOT EXISTS $DB_DATABASE; CREATE USER IF NOT EXISTS '$DB_USERNAME'@'%' IDENTIFIED BY '$DB_PASSWORD'; GRANT ALL ON *.* TO '$DB_USERNAME'@'%'; FLUSH PRIVILEGES;"

      - name: Install PHP dependencies
        working-directory: skuul
        run: composer install --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare the environment
        working-directory: skuul
        run: |
          cp .env.example .env
          php artisan key:generate
          chmod -R 777 storage bootstrap/cache

      - name: Build front-end assets
        working-directory: skuul
        run: |
          npm ci
          npm run build

      - name: Run tests
        working-directory: skuul
        run: php artisan test
